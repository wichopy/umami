services:
  - type: web
    name: umami
    runtime: docker
    healthCheckPath: /api/heartbeat
    envVars:
      - key: NEXT_BUILD_CPUS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: umami-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true

databases:
  - name: umami-db
    databaseName: umami
    ipAllowList: []
